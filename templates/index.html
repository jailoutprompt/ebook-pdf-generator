<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전자책 PDF 생성기</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>전자책 PDF 생성기</h1>
        <p class="subtitle">텍스트를 입력하면 30페이지 전자책 PDF를 만들어 드립니다</p>

        <form id="ebookForm" enctype="multipart/form-data">
            <div class="form-row">
                <div class="form-group">
                    <label for="title">책 제목</label>
                    <input type="text" id="title" name="title" placeholder="나의 이야기">
                </div>
                <div class="form-group">
                    <label for="author">저자</label>
                    <input type="text" id="author" name="author" placeholder="홍길동">
                </div>
            </div>

            <div class="form-group">
                <label for="text">내용 입력</label>
                <textarea id="text" name="text" rows="14"
                    placeholder="여기에 인생 이야기, 사업 경험, 또는 전자책으로 만들고 싶은 내용을 입력하세요.&#10;&#10;빈 줄로 단락을 구분하면 자동으로 챕터가 나뉩니다.&#10;'제1장', '챕터 1' 같은 제목을 넣으면 해당 위치에서 장이 구분됩니다."></textarea>
            </div>

            <div class="form-group file-group">
                <label for="file">또는 파일 업로드 (.txt, .docx)</label>
                <div class="file-input-wrapper">
                    <input type="file" id="file" name="file" accept=".txt,.docx">
                    <span class="file-label" id="fileLabel">파일을 선택하세요</span>
                </div>
            </div>

            <button type="submit" id="submitBtn">
                <span class="btn-text">PDF 전자책 생성</span>
                <span class="btn-loading" style="display:none;">생성 중...</span>
            </button>
        </form>

        <div id="errorMsg" class="error" style="display:none;"></div>
    </div>

    <script>
        const form = document.getElementById('ebookForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = submitBtn.querySelector('.btn-text');
        const btnLoading = submitBtn.querySelector('.btn-loading');
        const errorMsg = document.getElementById('errorMsg');
        const fileInput = document.getElementById('file');
        const fileLabel = document.getElementById('fileLabel');

        fileInput.addEventListener('change', () => {
            fileLabel.textContent = fileInput.files[0]
                ? fileInput.files[0].name
                : '파일을 선택하세요';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            btnText.style.display = 'none';
            btnLoading.style.display = 'inline';
            submitBtn.disabled = true;

            const formData = new FormData(form);

            try {
                const resp = await fetch('/generate', {
                    method: 'POST',
                    body: formData,
                });

                if (!resp.ok) {
                    const data = await resp.json();
                    throw new Error(data.error || '알 수 없는 오류가 발생했습니다.');
                }

                const blob = await resp.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                const title = document.getElementById('title').value.trim() || '나의 전자책';
                a.href = url;
                a.download = title + '.pdf';
                document.body.appendChild(a);
                a.click();
                a.remove();
                URL.revokeObjectURL(url);
            } catch (err) {
                errorMsg.textContent = err.message;
                errorMsg.style.display = 'block';
            } finally {
                btnText.style.display = 'inline';
                btnLoading.style.display = 'none';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
